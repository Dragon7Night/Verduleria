<!doctype html>
<!-- TEMPLATE REUTILIZABLE PARA CREAR Y EDITAR CATEGORÍAS Y PRODUCTOS -->
{% load static %}
<html lang="es" class="h-100" data-bs-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Formulario de Gestión - Verdulería San José</title>

    <!-- CSS STATIC -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/rework_style.css' %}">

    <!-- CSS BS5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Icons BS5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body class="d-flex h-100 text-center">

    <div class="container d-flex w-100 h-100 p-3 mx-auto flex-column">

        <!-- BARRA DE NAVEGACIÓN -->
        <header class="mb-4 navbar-custom shadow-sm p-3">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
                <h3 class="mb-2 mb-md-0 fw-bold text-success d-flex align-items-center gap-2">
                    <i class="bi bi-shop fs-3"></i> Verdulería San José
                </h3>
                <nav class="nav nav-masthead justify-content-center gap-2">
                    <a class="nav-link nav-link-custom" href="{% url 'homeUniversidad' %}">
                        <i class="bi bi-house-door-fill me-1"></i> Home
                    </a>
                    <a class="nav-link nav-link-custom" href="{% url 'categoriaDataName' %}">
                        <i class="bi bi-tags-fill me-1"></i> Categorías
                    </a>
                    <a class="nav-link nav-link-custom" href="{% url 'productoDataName' %}">
                        <i class="bi bi-basket-fill me-1"></i> Productos
                    </a>
                </nav>
            </div>
        </header>

        <!-- CONTENIDO DEL FORMULARIO -->
        <main class="my-auto">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card card-custom p-4 p-md-5 shadow-sm text-start">
                        <div class="card-body">
                            <h2 class="fw-bold text-success text-center mb-4">
                                <i class="bi bi-pencil-square me-2"></i>{{txtForm}}
                            </h2>

                            <form method="post" class="needs-validation">
                                {% csrf_token %}
                                
                                <div class="mb-3">
                                    {{formKey.as_p}}
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button type="submit" class="btn btn-success btn-lg rounded-pill shadow-sm fw-semibold">
                                        <i class="bi bi-check-circle-fill me-2"></i>{{txtBtn}}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-auto text-muted small py-3 text-center">
            <p class="m-0">&copy; Verdulería San José - Panel de Gestión</p>
        </footer>

    </div>

    <!-- JS BS5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
